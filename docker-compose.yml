services:
  db:
    image: postgres:16-alpine
    container_name: dkp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dkp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dkp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dkp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dkp_postgres_data:
