name: Keep Render Demo Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render services
        run: |
          curl --fail --silent --show-error --max-time 20 https://dkp-backend.onrender.com/api/status || true
          curl --fail --silent --show-error --max-time 20 https://dkp-python-service-ndrl.onrender.com/health || true
